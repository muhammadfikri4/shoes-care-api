name: Deploy to Railway

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: shoes-care-api (shoes-care / production)
    env:
      SERVICE_NAME: "Shoes Care API"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Commits
        id: commits
        run: |
          COMMITS=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | "• `\(.id[0:7])` \(.message)"' | head -10)
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Discord - Start
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Start**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 16776960
          embed-url: ${{ github.event.head_commit.url }}

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy
        run: |
          if [ -n "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
          else
            railway up
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Discord - Success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Success**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 3066993
          embed-url: ${{ github.event.head_commit.url }}

      - name: Notify Discord - Failure
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Failed**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 15158332
          embed-url: ${{ github.event.head_commit.url }}
