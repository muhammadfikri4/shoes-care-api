name: Deploy to Railway

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: shoes-care-api (shoes-care / production)
    env:
      SERVICE_NAME: "Shoes Care API"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Commits
        id: commits
        run: |
          COMMITS=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | "• `\(.id[0:7])` \(.message)"' | head -10)
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Discord - Start
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Start**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 16776960
          embed-url: ${{ github.event.head_commit.url }}

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy
        id: deploy
        run: |
          echo "Starting deployment..."
          if [ -n "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            DEPLOYMENT_ID=$(railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach --json | jq -r '.deploymentId')
          else
            DEPLOYMENT_ID=$(railway up --detach --json | jq -r '.deploymentId')
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "Deployment ID: $DEPLOYMENT_ID"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to complete..."
          DEPLOYMENT_ID="${{ steps.deploy.outputs.deployment_id }}"
          MAX_WAIT=600  # 10 minutes
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(railway status --service ${{ secrets.RAILWAY_SERVICE_ID }} --json | jq -r '.status')
            echo "Current status: $STATUS (${ELAPSED}s elapsed)"
            
            if [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "ACTIVE" ]; then
              echo "✅ Deployment successful!"
              exit 0
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              echo "❌ Deployment failed!"
              exit 1
            fi
            
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          echo "⏱️ Deployment timeout after ${MAX_WAIT}s"
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Discord - Success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Success**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 3066993
          embed-url: ${{ github.event.head_commit.url }}

      - name: Notify Discord - Failure
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Failed**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 15158332
          embed-url: ${{ github.event.head_commit.url }}
