name: Deploy to Railway

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: shoes-care-api (shoes-care / production)
    env:
      SERVICE_NAME: "Shoes Care API"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Commits
        id: commits
        run: |
          COMMITS=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[] | "• `\(.id[0:7])` \(.message)"' | head -10)
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Notify Discord - Start
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Start**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 16776960
          embed-url: ${{ github.event.head_commit.url }}

      - name: Wait for Railway Deployment
        id: railway_status
        run: |
          echo "Waiting for Railway deployment to start..."
          sleep 30  # Give Railway time to pick up the push

          MAX_WAIT=600  # 10 minutes
          ELAPSED=0
          DEPLOYMENT_FOUND=false

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            echo "Checking Railway deployment status... (${ELAPSED}s elapsed)"
            
            # Get latest deployment status from Railway API
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              "https://backboard.railway.app/graphql" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "query { deployments(input: { serviceId: \"${{ secrets.RAILWAY_SERVICE_ID }}\", limit: 1 }) { edges { node { id status createdAt } } } }"
              }')
            
            STATUS=$(echo $RESPONSE | jq -r '.data.deployments.edges[0].node.status // "UNKNOWN"')
            echo "Current status: $STATUS"
            
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Deployment successful!"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CRASHED" ]; then
              echo "❌ Deployment failed!"
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
            elif [ "$STATUS" != "UNKNOWN" ]; then
              DEPLOYMENT_FOUND=true
            fi
            
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          if [ "$DEPLOYMENT_FOUND" = false ]; then
            echo "⚠️ No deployment found - Railway may not be configured for auto-deploy"
          else
            echo "⏱️ Deployment timeout after ${MAX_WAIT}s"
          fi
          echo "status=timeout" >> $GITHUB_OUTPUT
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Discord - Success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Success**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 3066993
          embed-url: ${{ github.event.head_commit.url }}

      - name: Notify Discord - Failure
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: "${{ env.SERVICE_NAME }}"
          embed-description: |
            **Pipeline Failed**

            **Branch:** `${{ github.ref_name }}`
            **Changes:**
            ${{ steps.commits.outputs.list }}

            **Author:** ${{ github.event.head_commit.author.name }}
          embed-color: 15158332
          embed-url: ${{ github.event.head_commit.url }}
