name: Deploy to Railway

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Discord - Start
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: "🚀 Deployment Started for **${{ github.repository }}** on branch **${{ github.ref_name }}**\nCommit: `${{ github.event.head_commit.message }}`"

      - name: Install Railway
        run: npm i -g @railway/cli

      - name: Deploy
        run: |
          if [ -n "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach
          else
            railway up --detach
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify Discord - Success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: "✅ Deployment Successful for **${{ github.repository }}** on branch **${{ github.ref_name }}**"

      - name: Notify Discord - Failure
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: "❌ Deployment Failed for **${{ github.repository }}** on branch **${{ github.ref_name }}**"
